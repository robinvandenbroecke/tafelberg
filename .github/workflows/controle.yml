name: Wijzigingen controleren
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:es5
      - run: npm run build:web
      - name: Ubuntu-pakketbron instellen
        run: |
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source_file"
            fi
          done
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controle-web
          path: test-results/
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
