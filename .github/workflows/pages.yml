name: Webapp publiceren
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:es5
      - run: npm run build:web
      - name: Ubuntu-pakketbron instellen
        run: |
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source_file"
            fi
          done
      - name: Browsers klaarzetten
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit
      - name: Schermen en offline gebruik controleren
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webapp-browsercontrole
          path: test-results/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
